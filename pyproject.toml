[project]
name = "zetodos-thomas"
version = "0.1.0"
description = "Offline Gospel of Thomas Coptic-to-Greek reconstruction tooling"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Zetodos" }]
dependencies = [
    "pydantic>=2.10",
    "typer>=0.15",
]

[project.scripts]
thomas = "zetodos_thomas.cli.app:app"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.9",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/zetodos_thomas"]

[tool.hatch.build.targets.wheel.sources]
"python" = ""

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["python", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ANN",  # type annotations
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ty.environment]
python-version = "3.12"
