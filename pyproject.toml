[project]
name = "zetodos-thomas"
version = "0.1.0"
description = "Offline Gospel of Thomas Coptic-to-Greek reconstruction tooling"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Zetodos" }]
dependencies = [
    "pydantic>=2.10",
    "typer>=0.15",
]

[project.optional-dependencies]
sword = [
    "pysword>=0.2.8",
]

[project.scripts]
thomas = "zetodos_thomas.cli.app:app"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pysword>=0.2.8",
    "ruff>=0.9",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/zetodos_thomas"]

[tool.hatch.build.targets.wheel.sources]
"python" = ""

# Ship redistributable JSON/XML (non-.py) inside the wheel for offline validate.
[tool.hatch.build.targets.wheel.force-include]
"python/zetodos_thomas/bundled/manifests/copsahhorner.json" = "zetodos_thomas/bundled/manifests/copsahhorner.json"
"python/zetodos_thomas/bundled/manifests/ntvmr-vaticanus-b.json" = "zetodos_thomas/bundled/manifests/ntvmr-vaticanus-b.json"
"python/zetodos_thomas/bundled/manifests/dilley-thomas.json" = "zetodos_thomas/bundled/manifests/dilley-thomas.json"
"python/zetodos_thomas/bundled/manifests/dclp-poxy-1.json" = "zetodos_thomas/bundled/manifests/dclp-poxy-1.json"
"python/zetodos_thomas/bundled/manifests/dclp-poxy-654.json" = "zetodos_thomas/bundled/manifests/dclp-poxy-654.json"
"python/zetodos_thomas/bundled/manifests/dclp-poxy-655.json" = "zetodos_thomas/bundled/manifests/dclp-poxy-655.json"
"python/zetodos_thomas/bundled/pilot/horner-vaticanus-nt-pilot.json" = "zetodos_thomas/bundled/pilot/horner-vaticanus-nt-pilot.json"
"python/zetodos_thomas/bundled/thomas/dilley-thomas-v6.2.0.json" = "zetodos_thomas/bundled/thomas/dilley-thomas-v6.2.0.json"
"python/zetodos_thomas/bundled/fragments/greek-thomas-fragments.json" = "zetodos_thomas/bundled/fragments/greek-thomas-fragments.json"
"python/zetodos_thomas/bundled/fragments/dclp/poxy-1-tm62838.xml" = "zetodos_thomas/bundled/fragments/dclp/poxy-1-tm62838.xml"
"python/zetodos_thomas/bundled/fragments/dclp/poxy-654-tm62840.xml" = "zetodos_thomas/bundled/fragments/dclp/poxy-654-tm62840.xml"
"python/zetodos_thomas/bundled/fragments/dclp/poxy-655-tm62839.xml" = "zetodos_thomas/bundled/fragments/dclp/poxy-655-tm62839.xml"
"python/zetodos_thomas/bundled/evidence/pilot/thomas-7-17-30-77.json" = "zetodos_thomas/bundled/evidence/pilot/thomas-7-17-30-77.json"
[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["python", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ANN",  # type annotations
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "RUF001"]
"python/zetodos_thomas/cli/**" = ["B008"]
"python/zetodos_thomas/ingest/ntvmr_vaticanus.py" = ["RUF001"]
"python/zetodos_thomas/ingest/copsahhorner.py" = ["RUF001"]
"python/zetodos_thomas/ingest/pilot.py" = ["RUF001"]
"python/zetodos_thomas/ingest/dilley_thomas.py" = ["RUF001"]
"python/zetodos_thomas/ingest/dclp_fragments.py" = ["RUF001"]
"python/zetodos_thomas/ingest/fragments.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ty.environment]
python-version = "3.12"
