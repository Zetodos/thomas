[project]
name = "zetodos-thomas"
version = "0.1.0"
description = "Offline Gospel of Thomas Coptic-to-Greek reconstruction tooling"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Zetodos" }]
dependencies = [
    "greek-accentuation>=1.2.0",
    "numpy>=2.5.5",
    "pydantic>=2.10",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.3",
    "torch>=2.15.0",
    "typer>=0.15",
]

[project.optional-dependencies]
sword = [
    "pysword>=0.2.8",
]

[project.scripts]
thomas = "zetodos_thomas.cli.app:app"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pysword>=0.2.8",
    "ruff>=0.9",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/zetodos_thomas"]

[tool.hatch.build.targets.wheel.sources]
"python" = ""

# Map redistributable data directly from data/ into the wheel without duplicating files in git.
[tool.hatch.build.targets.wheel.force-include]
"data/manifests/ccl-ddglc-tei.json" = "zetodos_thomas/data/manifests/ccl-ddglc-tei.json"
"data/manifests/copsahhorner.json" = "zetodos_thomas/data/manifests/copsahhorner.json"
"data/manifests/dclp-poxy-1.json" = "zetodos_thomas/data/manifests/dclp-poxy-1.json"
"data/manifests/dclp-poxy-654.json" = "zetodos_thomas/data/manifests/dclp-poxy-654.json"
"data/manifests/dclp-poxy-655.json" = "zetodos_thomas/data/manifests/dclp-poxy-655.json"
"data/manifests/dilley-thomas.json" = "zetodos_thomas/data/manifests/dilley-thomas.json"
"data/manifests/morphgnt-sblgnt.json" = "zetodos_thomas/data/manifests/morphgnt-sblgnt.json"
"data/manifests/scriptorium-sahidic-ot.json" = "zetodos_thomas/data/manifests/scriptorium-sahidic-ot.json"
"data/manifests/swete-lxx.json" = "zetodos_thomas/data/manifests/swete-lxx.json"
"data/sources/thomas/dilley-thomas-v6.2.0.json" = "zetodos_thomas/data/sources/thomas/dilley-thomas-v6.2.0.json"
"data/sources/fragments/greek-thomas-fragments.json" = "zetodos_thomas/data/sources/fragments/greek-thomas-fragments.json"
"data/sources/fragments/dclp/poxy-1-tm62838.xml" = "zetodos_thomas/data/sources/fragments/dclp/poxy-1-tm62838.xml"
"data/sources/fragments/dclp/poxy-654-tm62840.xml" = "zetodos_thomas/data/sources/fragments/dclp/poxy-654-tm62840.xml"
"data/sources/fragments/dclp/poxy-655-tm62839.xml" = "zetodos_thomas/data/sources/fragments/dclp/poxy-655-tm62839.xml"
"data/evidence/divergences/greek-thomas-fragment-divergences-v1.json" = "zetodos_thomas/data/evidence/divergences/greek-thomas-fragment-divergences-v1.json"
"data/evidence/pilot/thomas-7-17-30-77.json" = "zetodos_thomas/data/evidence/pilot/thomas-7-17-30-77.json"
"data/evidence/omissions/john-8-pa-omission-fixture-v3.json" = "zetodos_thomas/data/evidence/omissions/john-8-pa-omission-fixture-v3.json"

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["python", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ANN",  # type annotations
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "RUF001", "RUF003"]
"python/zetodos_thomas/cli/**" = ["B008", "RUF001"]
"python/zetodos_thomas/ingest/**" = ["RUF001"]
"python/zetodos_thomas/morphology/**" = ["RUF001", "RUF003"]
"python/zetodos_thomas/align/**" = ["RUF001"]
"python/zetodos_thomas/integrations/aligners/**" = ["RUF001"]
"python/zetodos_thomas/lexicon/**" = ["RUF001", "RUF003"]
"python/zetodos_thomas/reconstruct/**" = ["RUF001", "RUF003"]
"python/zetodos_thomas/neural/**" = ["RUF001", "RUF003"]
"python/zetodos_thomas/eval/**" = ["RUF001", "RUF003"]
"python/zetodos_thomas/schemas/**" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ty.environment]
python-version = "3.12"
