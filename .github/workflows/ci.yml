# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run pre-commit (same as local)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  package:
    name: package
    runs-on: ubuntu-latest
    needs: [pre-commit]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Build wheel
        run: uv build

      - name: Smoke-test wheel entrypoint
        run: |
          set -euo pipefail
          WHEEL="$(ls -1 dist/zetodos_thomas-*.whl | head -n 1)"
          test -n "${WHEEL}"
          uv venv .venv-wheel
          uv pip install --python .venv-wheel "${WHEEL}"
          .venv-wheel/bin/thomas --help
